<!-- templates/projects.html -->
{% extends 'base.html' %}

{% block title %}Projects{% endblock %}

{% block content %}
<section>
    <h2>My Projects</h2>

    <table border="1" style="width: 100%; text-align: left; border-collapse: collapse;">
        <tr>
            <th>Project</th>
            <th>Description</th>
            <th>Image</th>
            <th>Action</th> <!-- New column for delete button -->
        </tr>

        {% for project in projects %}
        <tr>
            <td>{{ project[1] }}</td> <!-- Project Title -->
            <td>{{ project[2] }}</td> <!-- Project Description -->
            <td>
                <img src="{{ url_for('static', filename='images/' + project[3]) }}" alt="{{ project[1] }}" style="width: 100%; max-width: 200px;">
            </td>
            <td>
                <!-- Delete Form -->
                <form action="/delete/{{ project[0] }}" method="POST" onsubmit="return confirm('Are you sure you want to delete this project?');">
                    <button type="submit">Delete</button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </table>
</section>
{% endblock %}
